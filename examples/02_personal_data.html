		<script type="text/javascript">
		function validaComp15_email(){

			$("#emailUNOError").html("");
			$("#emailDOSError").html("");
			$("#divEmailUNO").removeClass("error");
			$("#divEmailDOS").removeClass("error");
			var emailUNO = document.getElementById('emailUNO').value;
			var emailDOS = document.getElementById('emailDOS').value;


			if (emailUNO!="" || emailDOS!="")
			{
				if (emailUNO.toUpperCase() != emailDOS.toUpperCase() ){
					$("#emailDOSError").html($("#No_coinciden_las_direciones_de_Email_introducidas").val());
					$("#divEmailUNO").addClass("error");
					$("#divEmailDOS").addClass("error");
					$("#emailUNO").focus();
					return false;
				}
				if (!esEmailCorrecto(emailUNO))
				{
					$("#emailUNOError").html($("#La_direccion_de_correo_no_es_valida").val());
					$("#divEmailUNO").addClass("error");
					$("#emailUNO").focus();
					return false;
				}
			}
			else if($("#emailUNO").attr("required")){
				var strEsObliga = "Es un dato obligatorio";
				try {
					strEsObliga = document.getElementById("lit_es_dato_obligatorio").value;
				} catch (err) {}
				$("#emailUNOError").html(strEsObliga);
				$("#divEmailUNO").addClass("error");
				$("#emailUNO").focus();
				return false;
			}
			return true;
		}
	</script>
