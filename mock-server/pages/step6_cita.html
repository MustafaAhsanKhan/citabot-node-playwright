<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Selecciona cita</title></head>
<body>
<form action="/icpco/advance" method="post">
    <fieldset>
        <legend>Selecciona una de las siguientes citas disponibles</legend>
        <div class="mf-layout--row">
            <div id="cita_1" class="mf-layout--module__s tc">
                <label id="lCita_1" for="cita1"><strong>CITA 1</strong><br>Día: 17/02/2026<br>Hora: 09:50</label>
                <input type="radio" id="cita1" name="rdbCita" value="1">
            </div>
            <div id="cita_2" class="mf-layout--module__s tc">
                <label id="lCita_2" for="cita2"><strong>CITA 2</strong><br>Día: 18/02/2026<br>Hora: 09:30</label>
                <input type="radio" id="cita2" name="rdbCita" value="2">
            </div>
            <div id="cita_3" class="mf-layout--module__s tc">
                <label id="lCita_3" for="cita3"><strong>CITA 3</strong><br>Día: 19/02/2026<br>Hora: 09:30</label>
                <input type="radio" id="cita3" name="rdbCita" value="3">
            </div>
        </div>
        <div id="comp19_captcha">
            <label for="captcha">Por favor, valida el Captcha para poder continuar</label>
            <input type="text" id="captcha" name="txtCaptcha" placeholder="Introduce el texto aquí">
        </div>
    </fieldset>
    <input type="submit" id="btnSiguiente" class="mf-button primary" value="Siguiente">
</form>
</body>
</html>
