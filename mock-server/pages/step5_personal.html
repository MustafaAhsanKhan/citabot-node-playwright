<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Información complementaria</title></head>
<body>
<form action="/icpco/advance" method="post">
    <fieldset>
        <legend>Identidad del usuario de cita</legend>
        <span>EXAMPLE USER - X0000000T</span>
    </fieldset>
    <div class="fld">
        <label for="txtTelefonoCitado">Teléfono</label>
        <input type="tel" id="txtTelefonoCitado" name="txtTelefonoCitado" value="">
    </div>
    <div class="fld">
        <label for="emailUNO">Correo electrónico</label>
        <input type="email" id="emailUNO" name="txtMailCitado" value="">
    </div>
    <div class="fld">
        <label for="emailDOS">Repite Correo electrónico</label>
        <input type="email" id="emailDOS" name="emailDOS" value="">
    </div>
    <input type="submit" id="btnSiguiente" class="mf-button primary" value="Siguiente">
</form>
</body>
</html>
